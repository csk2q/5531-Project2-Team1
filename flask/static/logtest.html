<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Logs (polling)</title>
  <style>
    pre { height: 70vh; overflow: auto; background:#111;color:#eee;padding:10px; }
  </style>
</head>
<body>
  <pre id="log"></pre>
  <script>
    const logEl = document.getElementById('log');
    let next = 0;
    const pollIntervalMs = 1500;
    async function poll() {
      try {
        const url = `http://127.0.0.1:5000/api/monitoring/logs/poll?since=${next}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();
        (data.logs || []).forEach(l => {
          logEl.textContent += l + '\n';
        });
        next = data.next ?? next;
        logEl.scrollTop = logEl.scrollHeight;
      } catch (err) {
        console.error('Poll error', err);
      } finally {
        setTimeout(poll, pollIntervalMs);
      }
    }
    poll();
  </script>
</body>
</html>
